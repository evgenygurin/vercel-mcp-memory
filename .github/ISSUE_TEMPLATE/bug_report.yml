name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you're experiencing
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Deploy to Vercel with config...
        2. Call API endpoint with...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Error Messages/Logs
      description: If applicable, paste any error messages or logs here
      render: shell
      placeholder: |
        Error: ...
        Stack trace: ...

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - MCP Server (API endpoint)
        - Database (PostgreSQL/pgvector)
        - Embeddings (OpenAI)
        - Authentication
        - Deployment (Vercel)
        - Claude Desktop Integration
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you using? (check package.json or latest commit hash)
      placeholder: e.g., 1.0.0 or commit hash

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your environment
      placeholder: |
        - Node.js version: 20.x
        - Deployment: Vercel (Free/Pro)
        - PostgreSQL: Vercel Postgres / Neon / Other
        - Claude Desktop version:
      value: |
        - Node.js version:
        - Deployment:
        - PostgreSQL:
        - Claude Desktop version:

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context about the problem
      placeholder: Add any other relevant information here

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues to ensure this isn't a duplicate
          required: true
        - label: I have provided all required information above
          required: true
        - label: I have checked the troubleshooting section in README.md
          required: false

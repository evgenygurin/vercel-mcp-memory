name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *' # Daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs within 7 days. Thank you for your contributions!'
          close-issue-message: 'This issue has been automatically closed due to inactivity. If this is still relevant, please feel free to reopen or create a new issue.'
          days-before-issue-stale: 60
          days-before-issue-close: 7
          stale-issue-label: 'status: stale'
          exempt-issue-labels: 'status: in progress,priority: high,priority: critical,good first issue'

          # Pull Requests
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs within 7 days.'
          close-pr-message: 'This pull request has been automatically closed due to inactivity.'
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'status: stale'
          exempt-pr-labels: 'status: in progress,priority: high,priority: critical'

          # Configuration
          operations-per-run: 30
          remove-stale-when-updated: true
